name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # Репозиторий публичный: комментировать issue может кто угодно, а вызов агента
    # тратит наши токены. Поэтому к проверке команды добавлена проверка того, кто её
    # написал — вызывать агента могут только владелец и коллабораторы репозитория.
    # Она же закрывает самозапуск: агент отвечает от имени GitHub App, а у бота
    # такого отношения к репозиторию нет, и его собственный `/oc` в ответе не сработает.
    if: |
      github.event.comment.user.type != 'Bot' &&
      contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      (contains(github.event.comment.body, ' /oc') ||
       startsWith(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, ' /opencode') ||
       startsWith(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    # Зависшая джоба без лимита работает до умолчания GitHub — шести часов. За одну
    # сессию 30.08 два прогона висели 42 и 55 минут и были остановлены руками; успешные
    # укладывались в 30 секунд для разбора и 5 минут для правки кода.
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          # Единственная модель OpenCode Zen, доступная без привязанной карты.
          # Остальные (claude-*, gemini-*, glm-*, deepseek-*) отвечают
          # "No payment method" — проверено и в CI, и локально.
          model: opencode/big-pickle