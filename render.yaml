# Blueprint для Render: описывает деплой в репозитории, чтобы настройку
# не приходилось повторять руками через веб-интерфейс.
#
# DATABASE_URL здесь намеренно нет. Postgres-ветка кода не исполнялась ни разу
# (см. «Открытые вопросы» в PLAN.md), поэтому сервис поднимается на хранилище
# в памяти: данные сбрасываются при перезапуске, что ТЗ прямо разрешает.
# Добавлять переменную можно только после того, как схема хотя бы раз накатана.
services:
  - type: web
    name: calendar-booking
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    # Render сам подставит PORT в окружение контейнера — задавать его здесь не нужно.
    healthCheckPath: /event-types
    envVars:
      - key: NODE_ENV
        value: production
      # Демо-данные на продакшене оставлены намеренно: публичная ссылка — это витрина
      # проекта, и проверяющий должен открыть её и сразу пройти путь записи, а в пустом
      # календаре выбирать нечего. Выключается значением "false".
      #
      # Проверено 20.09.2026: переменные из этого блюпринта до работающего сервиса не
      # доезжают — при `value: "false"` демо-данные на проде всё равно создавались.
      # Значит render.yaml описывает намерение, а фактическое окружение задано в
      # настройках сервиса. Совпадение обеспечено умолчанием: без переменной засев включён.
      - key: SEED_DEMO
        value: "true"
